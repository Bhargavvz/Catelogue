<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bhargav Adepu">
  <title>Bhargav Adepu</title>
  <!--
    A printed block: minium ground, paper letterform.

    The B is the real Instrument Serif outline, extracted from the font file the
    site is set in, so the mark and the masthead are literally the same letter.
    Minium rather than ink because red is the one colour that holds up against
    both a light and a dark browser chrome, which is where this actually lives.
  -->
  <rect width="64" height="64" fill="#b23a1e"/>
  <!--
    The stroke is not decoration: Instrument Serif is a high-contrast face and
    its hairlines disappear at 16px. Outlining the glyph in its own colour
    thickens the thin strokes just enough to survive a tab strip.
  -->
  <g transform="translate(32 32) scale(1.16) translate(-32 -32)" fill="#f6f2e9"
     stroke="#f6f2e9" stroke-width="0.9" stroke-linejoin="round">
